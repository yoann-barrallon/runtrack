spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/runtrack_db
    username: runner
    password: secret
    driver-class-name: org.postgresql.Driver
  mvc:
    problemdetails:
      enabled: true
  application:
    name: runtrack

  cache:
    type: redis

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  web:
    error:
      whitelabel:
        enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: ${JWT_SECRET:runtrack-development-secret-key-change-me-32-chars}